<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      text { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
      .t-title { font-size: 44px; font-weight: 700; fill: #1F2430; }
      .t-sub   { font-size: 19px; fill: #6B7280; }
      .col-h   { font-size: 21px; font-weight: 700; }
      .card-n  { font-size: 22px; font-weight: 700; fill: #1F2430; }
      .card-n2 { font-size: 19px; font-weight: 700; fill: #1F2430; }
      .card-d  { font-size: 16px; fill: #4B5563; }
      .card-s  { font-size: 15.5px; fill: #4B5563; }
      .accent  { font-size: 15px; fill: #8A6D3B; }
      .meta    { font-size: 12.5px; fill: #9CA3AF; }
      .chip-t  { font-size: 13px; }
      .fnd-h   { font-size: 20px; font-weight: 700; fill: #4A3F2A; }
      .fnd-t   { font-size: 15.5px; fill: #5B5245; }
      .foot    { font-size: 16px; fill: #6B7280; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFDF8"/>

  <!-- decorative basketball -->
  <g opacity="0.07">
    <circle cx="1472" cy="46" r="74" fill="#F4731C"/>
    <path d="M1398 46 H1546 M1472 -28 V120 M1420 -6 Q1472 46 1420 98 M1524 -6 Q1472 46 1524 98"
          stroke="#FFFDF8" stroke-width="4" fill="none"/>
  </g>

  <text class="t-title" x="60" y="68">What’s inside HoopAI?</text>
  <text class="t-sub" x="60" y="102">A little program that finds the baskets in a basketball video and cuts them into highlight clips</text>

  <!-- ============ COLUMN 1 : EYES ============ -->
  <rect x="60" y="132" width="473" height="52" rx="14" fill="#E8F0FE"/>
  <text class="col-h" x="82" y="165" fill="#1B4FBF">👀 Eyes — take the video in</text>

  <rect x="60" y="204" width="473" height="238" rx="14" fill="#FFFFFF" stroke="#CFE0FD" stroke-width="1.5"/>
  <text class="card-n" x="82" y="242">OpenCV</text>
  <rect x="82" y="256" width="186" height="26" rx="8" fill="#E8F0FE"/>
  <text class="chip-t mono" x="92" y="274" fill="#1B4FBF">opencv-python ≥4.8</text>
  <text class="card-d" x="82" y="310">Splits a whole video into single</text>
  <text class="card-d" x="82" y="336">still photos, and works out which</text>
  <text class="card-d" x="82" y="362">second of the video each one is.</text>
  <line x1="82" y1="386" x2="511" y2="386" stroke="#EEF2F7" stroke-width="1.5"/>
  <text class="accent" x="82" y="414">💡 Like flipping through a cartoon, page by page</text>

  <rect x="60" y="462" width="473" height="238" rx="14" fill="#FFFFFF" stroke="#CFE0FD" stroke-width="1.5"/>
  <text class="card-n" x="82" y="500">NumPy</text>
  <rect x="82" y="514" width="128" height="26" rx="8" fill="#E8F0FE"/>
  <text class="chip-t mono" x="92" y="532" fill="#1B4FBF">numpy ≥1.24</text>
  <text class="card-d" x="82" y="568">To a computer, a photo is really</text>
  <text class="card-d" x="82" y="594">just a big pile of numbers. NumPy</text>
  <text class="card-d" x="82" y="620">moves those numbers around, fast.</text>
  <line x1="82" y1="644" x2="511" y2="644" stroke="#EEF2F7" stroke-width="1.5"/>
  <text class="accent" x="82" y="672">💡 A photo = one enormous table of numbers</text>

  <!-- flow chevron 1 -->
  <path d="M541 440 L556 452 L541 464 Z" fill="#D6CFC2"/>

  <!-- ============ COLUMN 2 : BRAIN ============ -->
  <rect x="563" y="132" width="473" height="52" rx="14" fill="#F1EBFE"/>
  <text class="col-h" x="585" y="165" fill="#5B2FB8">🧠 Brain — find them, then judge</text>

  <rect x="563" y="204" width="473" height="112" rx="14" fill="#FFFFFF" stroke="#DFD2FA" stroke-width="1.5"/>
  <text class="card-n2" x="585" y="236">YOLOv8 · Ultralytics</text>
  <text class="meta mono" x="585" y="256">ultralytics ≥8.0</text>
  <text class="card-s" x="585" y="282">An AI that is good at finding things. We</text>
  <text class="card-s" x="585" y="304">taught it just two: the ball 🏀 and the hoop ⭕</text>

  <rect x="563" y="332" width="473" height="112" rx="14" fill="#FFFFFF" stroke="#DFD2FA" stroke-width="1.5"/>
  <text class="card-n2" x="585" y="364">basketball.pt</text>
  <text class="meta mono" x="585" y="384">23 MB · trained by us</text>
  <text class="card-s" x="585" y="410">The memory the AI kept after training.</text>
  <text class="card-s" x="585" y="432">Swap this file and it gets smarter or dumber.</text>

  <rect x="563" y="460" width="473" height="112" rx="14" fill="#FFFFFF" stroke="#DFD2FA" stroke-width="1.5"/>
  <text class="card-n2" x="585" y="492">Roboflow dataset</text>
  <text class="meta mono" x="585" y="512">1389 labelled photos · CC BY 4.0</text>
  <text class="card-s" x="585" y="538">The AI’s workbook: humans circled the ball</text>
  <text class="card-s" x="585" y="560">and the hoop first, then the AI copied them.</text>

  <rect x="563" y="588" width="473" height="112" rx="14" fill="#FFFFFF" stroke="#DFD2FA" stroke-width="1.5"/>
  <text class="card-n2" x="585" y="620">Our own scoring rule</text>
  <text class="meta mono" x="585" y="640">plain Python · no AI involved</text>
  <text class="card-s" x="585" y="666">The AI only says where the ball and hoop are.</text>
  <text class="card-s" x="585" y="688">Whether it counts is a rule we wrote (figure 2).</text>

  <!-- flow chevron 2 -->
  <path d="M1044 440 L1059 452 L1044 464 Z" fill="#D6CFC2"/>

  <!-- ============ COLUMN 3 : HANDS ============ -->
  <rect x="1066" y="132" width="473" height="52" rx="14" fill="#FEEEE2"/>
  <text class="col-h" x="1088" y="165" fill="#C2520C">✋ Hands — cut out the good bits</text>

  <rect x="1066" y="204" width="473" height="322" rx="14" fill="#FFFFFF" stroke="#FBD8BD" stroke-width="1.5"/>
  <text class="card-n" x="1088" y="242">FFmpeg</text>
  <rect x="1088" y="256" width="258" height="26" rx="8" fill="#FEEEE2"/>
  <text class="chip-t mono" x="1098" y="274" fill="#C2520C">a command-line tool, not a library</text>
  <text class="card-d" x="1088" y="310">The Swiss army knife of video — it can</text>
  <text class="card-d" x="1088" y="336">cut or convert just about anything.</text>
  <text class="card-n2" x="1088" y="382">We use one trick only:</text>
  <text class="card-d" x="1088" y="412">cut from 4 seconds before the basket</text>
  <text class="card-d" x="1088" y="438">to 2 seconds after.</text>
  <line x1="1088" y1="462" x2="1517" y2="462" stroke="#EEF2F7" stroke-width="1.5"/>
  <text class="accent" x="1088" y="488">💡 It is not a Python library — we call it the</text>
  <text class="accent" x="1088" y="510">way you would type a command in a terminal.</text>

  <rect x="1066" y="546" width="473" height="154" rx="14" fill="#FEF6EF" stroke="#F8C9A4" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text class="card-n2" x="1088" y="582" fill="#C2520C">🎬 What comes out</text>
  <text class="card-s" x="1088" y="616">A set of 6-second highlight mp4 clips</text>
  <text class="card-s" x="1088" y="644">libx264 for the picture, aac for the sound</text>
  <text class="card-s" x="1088" y="672">The filename carries the basket’s timestamp</text>

  <!-- ============ FOUNDATION ============ -->
  <rect x="60" y="724" width="1480" height="104" rx="18" fill="#F3EFE6" stroke="#E4DCCB" stroke-width="1.5"/>
  <text class="fnd-h" x="88" y="762">🧰 The base — what ties all of this together</text>
  <text class="fnd-t" x="88" y="798">Python 3.12 — the language it is all written in</text>
  <text class="fnd-t" x="600" y="798">Git + GitHub — remembers every change</text>
  <text class="fnd-t" x="1060" y="798">tqdm — installed, progress bar not wired up 🙈</text>

  <text class="foot" x="60" y="866">⚠️ Honest note: this AI has only “been to 2 lessons” (2 of the 20 planned rounds), so it still misses the odd basket — that is the first thing to improve.</text>
</svg>
