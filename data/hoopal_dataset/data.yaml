# Adjusted from the Roboflow export default (`../train/images`): this repo keeps
# the export one directory deeper, so the payload sits beside this file.
# NOTE: valid/ and test/ are empty in this export — see docs/RUNBOOK.md, this
# dataset cannot be trained on standalone.
train: train/images
val: valid/images
test: test/images

nc: 2
names: ['Basketball', 'Hoop']

roboflow:
  workspace: yimings-workspace-vykdp
  project: hoopai
  version: dataset
  license: CC BY 4.0
  url: https://universe.roboflow.com/yimings-workspace-vykdp/hoopai/dataset/dataset
