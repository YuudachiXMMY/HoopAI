# Simplified from the Roboflow export default (`../train/images`). That form was
# NOT broken: ultralytics retries without the `../` prefix when the first attempt
# does not exist, so it already landed here. Dropping it just removes a hop.
# Paths are relative to the dataset root — see hoopai.yaml for how that root is
# derived and why `data=` must be passed as an absolute path.
train: train/images
val: valid/images
test: test/images

nc: 2
names: ['basketball', 'hoop']

roboflow:
  workspace: basketball-qus2n
  project: basketball-detection
  version: 1
  license: CC BY 4.0
  url: https://universe.roboflow.com/basketball-qus2n/basketball-detection/dataset/1
